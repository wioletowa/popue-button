name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - name: Test
        run: cargo test --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          mkdir dist
          tar -czf dist/popue-button-${{ matrix.name }}.tar.gz -C target/release popue-button

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked
          mkdir dist
          cp target/release/popue-button.exe dist/popue-button-${{ matrix.name }}.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          app=Popue.app
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          lipo -create -output $app/Contents/MacOS/popue-button \
            target/aarch64-apple-darwin/release/popue-button \
            target/x86_64-apple-darwin/release/popue-button
          cp packaging/macos/Info.plist $app/Contents/Info.plist
          mkdir Popue.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out Popue.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon.png --out Popue.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns Popue.iconset -o $app/Contents/Resources/Popue.icns
          codesign --force --deep --sign - $app
          mkdir dist
          ditto -c -k --keepParent $app dist/popue-button-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: popue-button-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
